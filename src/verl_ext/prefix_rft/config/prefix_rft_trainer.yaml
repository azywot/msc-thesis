# Primary Hydra config for Prefix-RFT training.
#
# The vendored AgentFlow config (src/fine_tuning/agentflow/verl/config.yaml) cannot
# be composed as a default: it declares hydra.searchpath, which Hydra allows only in
# a primary config. Its keys are therefore inlined below, under AGENTFLOW BASE.
# scripts/check_prefix_rft_trainer_sync.py asserts that block still matches the
# vendored file, so a re-vendor cannot silently change training only for GRPO.
#
# Every prefix_rft value traces to papers/PrefixRFT_2507.01679v3.md or to
# repos/prefix_rft; the citation sits on the line above it.

hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# ---- AGENTFLOW BASE: mirrors src/fine_tuning/agentflow/verl/config.yaml ----
agentflow:
  port: 9999

data:
  filter_overlong_prompts: false
  train_max_samples: -1  # null means no limit by default

actor_rollout_ref:
  rollout:
    mode: async
    agent:
      custom_async_server:
        path: pkg://fine_tuning.agentflow.verl.async_server
        name: PatchedvLLMServer
# ---- END AGENTFLOW BASE ----

prefix_rft:
  enable: true
  demos_path: data/training/prefix_rft/prefix_demos.parquet
  # Paper A.2: "we sample 8 rollouts per prompt, and one of them starts with the
  # sampled prefix."
  n_prefixed_rollouts: 1
  # How prefix length is measured. "steps" replays whole teacher decisions,
  # k = clamp(floor(l * m), 0, m - 1), which is this project's adaptation.
  # "tokens" is the paper's own measure (A.2): a token fraction of the whole
  # demonstration, which can split a decision in half. Default "steps" so every
  # existing config keeps its meaning.
  mode: steps
  # Fewest teacher decisions a question needs before it can carry a prefix. Step mode
  # is structurally limited to 2 by its k <= m-1 clamp; token mode needs no second
  # decision, so at the default of 1 the two modes prefix different question sets
  # (1085 against 1358). Set to 2 in token mode to make the comparison controlled.
  min_demo_decisions: 1
  # Paper A.2: l ~ U(low_t, 0.95), low_t cosine-decaying 0.95 -> 0.05.
  high: 0.95
  low_init: 0.95
  low_target: 0.05
  # BetaSampler defaults (global_step.py:258); alpha = beta = 1 is the uniform
  # draw A.2 specifies.
  sampler_alpha: 1.0
  sampler_beta: 1.0
  # Paper A.2 and section 6: keep the top 20% highest-entropy prefix tokens.
  entropy_keep_ratio: 0.2
  # "none" reproduces the reference (core_algos.py:189-191). "group" recentres the
  # hybrid rollout's continuation tokens; see the spec's risk note. Do not change
  # without recording it.
  singleton_baseline: none
  seed: 42
