# GAIA — SFT LoRA-adapted Qwen3-8B orchestrator + Qwen3-1.7B subagents, thinking disabled
# TODO: set lora_adapter_path below to the SAME SFT checkpoint as CKPT_DIR in
#   ../../SFT_eval_gaia_qwen8B_sub1_7b_none.job. If they disagree the job's merge
#   step rebuilds an adapter the YAML never loads, and the eval silently runs the
#   wrong checkpoint — corrupting the BASE/GRPO/SFT comparison. Keep them in sync.

name: "SFT_eval_gaia_qwen8B_sub1_7b_none"
description: "[SFT inference] GAIA all_validation with SFT LoRA-adapted Qwen3-8B orchestrator (thinking disabled) + Qwen3-1.7B subagents (no thinking)."

slurm:
  partition: "gpu_h100"
  num_gpus: 2
  ntasks: 1
  cpus_per_task: 8
  time: "24:00:00"
  conda_env: "agent_engine"

models:
  orchestrator:
    name: "Qwen3-8B-SFT-LoRA"
    family: "qwen3"
    path_or_id: "Qwen/Qwen3-8B"
    role: "orchestrator"
    lora_adapter_path: "<TODO: path to merged SFT LoRA adapter, e.g. /scratch-shared/xchen/fine_tuning/sft/qwen3-8b-sft-v1/global_step_90/merged_best/lora_adapter>"
  web_search:
    name: "Qwen3-1.7B"
    family: "qwen3"
    path_or_id: "Qwen/Qwen3-1.7B"
    role: "web_search"
  code_generator:
    name: "Qwen3-1.7B"
    family: "qwen3"
    path_or_id: "Qwen/Qwen3-1.7B"
    role: "code_generator"
  text_inspector:
    name: "Qwen3-1.7B"
    family: "qwen3"
    path_or_id: "Qwen/Qwen3-1.7B"
    role: "text_inspector"

tools:
  enabled_tools:
    - web_search
    - code_generator
    - text_inspector
  direct_tool_call: false

dataset:
  name: "gaia"
  split: "all_validation"
  data_dir: "./data"
  subset_num: -1

seed: 0
thinking_mode: "NO"
output_dir: "./experiments/results/sft_inference/gaia/qwen8B_sft_sub1_7b_none"
use_wandb: true
wandb_project: "benchmarks"

cache_dir: "./cache"
