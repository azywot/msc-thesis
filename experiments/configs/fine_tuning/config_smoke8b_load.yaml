# experiments/configs/fine_tuning/config_smoke8b_load.yaml
# Resume-from-checkpoint smoke test. Verifies that LoRA mid-run resume actually works
# end-to-end despite launch_verl.py:123-125's pessimistic comment about model_world_size_*.pt.
#
# Source checkpoint (must exist before running this):
#   experiments/results/fine_tuning/qwen3-8b-grpo-smoke/20-05-2026_15-19-22970183/global_step_2/actor/
#     ├── lora_adapter/adapter_model.safetensors    (r=64, alpha=64, all-linear)
#     ├── optim_world_size_2_rank_{0,1}.pt          (LoRA-only Adam moments)
#     └── extra_state_world_size_2_rank_{0,1}.pt    (RNG + lr_scheduler)
#
# Resume mechanism (see scripts/launch_verl.py:80-96 and verl ray_trainer.py:923-969):
#   - trainer.resume_mode=resume_path + trainer.resume_from_path → recovers global_steps from
#     the folder name and calls actor_rollout_wg.load_checkpoint(actor_path).
#   - load_contents=['optimizer','extra'] (set by launch_verl.py for LoRA) so the loader
#     does NOT look for model_world_size_*.pt; it only loads optim + extra.
#   - lora.resume_adapter_path → actor_rollout_ref.model.lora_adapter_path so the worker
#     initialises PEFT with the saved adapter BEFORE the optimizer state is restored on top.
#
# Expected outcome:
#   - verl log prints  "Load from checkpoint folder: .../global_step_2"
#                      "Setting global step to 2"
#   - val_before_train runs at step 2 (sanity check on the loaded model)
#   - 2 new training steps land as global_step_3 and global_step_4 in the NEW run-tag dir
#     under experiments/results/fine_tuning/qwen3-8b-grpo-smoke/<NEW_DATE>-<NEW_JOBID>/
#   - The old checkpoint at 20-05-2026_15-19-22970183/ is NOT modified.
#
# If this passes, mid-run resume is safe — you can resubmit the same config with
# resume_mode=resume_path + the previous run's latest_checkpoint to continue training if
# the configured epochs spill past walltime.

env:
  BASE_MODEL: 'Qwen/Qwen3-8B'
  SUBAGENT_MODEL: 'Qwen/Qwen3-1.7B'
  SUBAGENT_ENDPOINT: 'http://localhost:9998/v1'
  N_GPUS: 2
  ROLLOUT_TP_SIZE: 1
  EXPERIMENT_NAME: 'qwen3-8b-grpo-smoke'
  PROJECT_NAME: 'msc-thesis-fine-tuning'
  BASE_DATA_DIR: 'data/training/smoke'
  ENABLE_TOOLS: ["web_search", "code_generator"]
  TOOL_STEPS: 2
  THINKING_MODE: 'NO'
  TRAIN_TEMPERATURE: 0.7
  TEST_TEMPERATURE: 0.0
  N_WORKERS: 1
  VERBOSITY: 'INFO'
  USE_LORA: "true"
  USE_SCRATCH_CHECKPOINTS: "false"
  SAVE_OPTIMIZER: "true"

python_args:
  agentflow.port: 9999
  ray_init.num_cpus: 16
  algorithm.adv_estimator: 'grpo'
  data.train_files: '${BASE_DATA_DIR}/train/combined_train.parquet'
  data.val_files:
    - '${BASE_DATA_DIR}/val/val_combined.parquet'
  data.train_batch_size: 4
  data.train_max_samples: 8
  data.dataloader_num_workers: 0
  data.max_prompt_length: 4096
  data.max_response_length: 2048
  data.truncation: 'truncate'
  actor_rollout_ref.rollout.n: 2
  actor_rollout_ref.actor.ppo_mini_batch_size: 4
  actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu: 1
  actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu: 1
  actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu: 1
  actor_rollout_ref.rollout.multi_turn.format: 'hermes'
  actor_rollout_ref.model.path: '${BASE_MODEL}'
  actor_rollout_ref.model.enable_gradient_checkpointing: true
  actor_rollout_ref.model.use_remove_padding: true
  actor_rollout_ref.actor.optim.lr: 1.0e-6
  actor_rollout_ref.actor.use_kl_loss: true
  actor_rollout_ref.actor.kl_loss_coef: 0.01
  actor_rollout_ref.actor.clip_ratio_low: 0.2
  actor_rollout_ref.actor.clip_ratio_high: 0.3
  actor_rollout_ref.actor.fsdp_config.param_offload: true
  actor_rollout_ref.actor.fsdp_config.optimizer_offload: true
  actor_rollout_ref.ref.fsdp_config.param_offload: true
  actor_rollout_ref.rollout.name: 'vllm'
  actor_rollout_ref.rollout.free_cache_engine: true
  actor_rollout_ref.rollout.gpu_memory_utilization: 0.45
  actor_rollout_ref.rollout.max_model_len: 6144
  actor_rollout_ref.rollout.max_num_batched_tokens: 6144
  actor_rollout_ref.rollout.max_num_seqs: 64
  actor_rollout_ref.rollout.tensor_model_parallel_size: '${ROLLOUT_TP_SIZE}'
  trainer.n_gpus_per_node: '${N_GPUS}'
  trainer.logger: ['console', 'wandb']
  trainer.project_name: '${PROJECT_NAME}'
  trainer.experiment_name: '${EXPERIMENT_NAME}'
  trainer.save_freq: 1
  trainer.test_freq: 1
  trainer.save_every_epoch: false
  trainer.val_every_epoch: false
  # total_epochs=2 with 8 samples / batch=4 → total_training_steps=4. Resuming at step 2
  # means 2 new training steps (global_step_3, global_step_4) before training exits.
  trainer.total_epochs: 2
  # Runs validation at the loaded step (2) BEFORE the first new training step — confirms the
  # restored model + optimizer didn't blow up at load time.
  trainer.val_before_train: true
  trainer.critic_warmup: 0
  algorithm.use_kl_in_reward: false
  # ── Resume from an existing LoRA checkpoint ────────────────────────────────────
  # resume_mode=resume_path explicitly targets the path below (auto would discover the
  # latest folder under trainer.default_local_dir, but launch_verl.py builds a NEW run-tag
  # dir each invocation, so auto wouldn't find this checkpoint).
  trainer.resume_mode: 'resume_path'
  trainer.resume_from_path: '/gpfs/home3/xchen1/azywot/msc-thesis/experiments/results/fine_tuning/qwen3-8b-grpo-smoke/20-05-2026_15-19-22970183/global_step_2'

lora:
  rank: 64
  alpha: 64
  target_modules: "all-linear"
  # Worker init reads this and applies the adapter weights on top of the base model BEFORE
  # the optimizer state is restored. Without it, the loaded optimizer moments would land on
  # a freshly-initialised (random) LoRA — semantically broken even if it doesn't crash.
  resume_adapter_path: '/gpfs/home3/xchen1/azywot/msc-thesis/experiments/results/fine_tuning/qwen3-8b-grpo-smoke/20-05-2026_15-19-22970183/global_step_2/actor/lora_adapter'
