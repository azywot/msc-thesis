# experiments/configs/fine_tuning/config_smoke.yaml
# Minimal smoke-test config — verifies the full VERL pipeline end-to-end on real hardware
# (8 training samples, 2 rollouts, 1 epoch).
#
# Uses **Qwen3-4B** (not 8B) and **N_GPUS=1** to keep the smoke test fast. GPU 0 = frozen
# sub-agent; GPU 1 = VERL with one H100 (~94 GB). Full training (config.yaml) uses Qwen3-8B
# with N_GPUS=4 on H100.
#
# SLURM: jobs/fine_tuning/003_smoke_4b.job allocates **2 GPUs** — see job script for CUDA_VISIBLE_DEVICES.
#
# Differences from config.yaml:
#   - BASE_MODEL: Qwen3-4B (smoke only)
#   - data dir: data/training/smoke
#   - train_max_samples: 8, rollout.n: 2, total_epochs: 1
#   - smaller batch / micro-batch sizes
#   - USE_SCRATCH_CHECKPOINTS: false (checkpoints stay in experiments/results/ — LoRA adapters
#     are tiny so GPFS home quota is not a concern)
#
# Launch with:
#   python scripts/launch_verl.py --config experiments/configs/fine_tuning/config_smoke.yaml
#   python scripts/train_orchestrator.py --config experiments/configs/fine_tuning/config_smoke.yaml
#
# IMPORTANT: Launch frozen sub-agent on GPU 0 before VERL (see jobs/fine_tuning/003_smoke_4b.job):
#   VLLM_USE_V1=0 CUDA_VISIBLE_DEVICES=0 vllm serve Qwen/Qwen3-1.7B --port 9998 --tensor-parallel-size 1 \
#       --gpu-memory-utilization 0.40 --max-model-len 8192
#   export SUBAGENT_ENDPOINT=http://localhost:9998/v1
#   CUDA_VISIBLE_DEVICES=1 python scripts/launch_verl.py --config experiments/configs/fine_tuning/config_smoke.yaml

env:
  BASE_MODEL: 'Qwen/Qwen3-4B'
  SUBAGENT_MODEL: 'Qwen/Qwen3-1.7B'
  SUBAGENT_ENDPOINT: 'http://localhost:9998/v1'
  N_GPUS: 1
  ROLLOUT_TP_SIZE: 1
  EXPERIMENT_NAME: 'qwen3-4b-grpo-smoke'
  PROJECT_NAME: 'msc-thesis-fine-tuning'
  BASE_DATA_DIR: 'data/training/smoke'
  ENABLE_TOOLS: ["web_search", "code_generator"]
  TOOL_STEPS: 2
  THINKING_MODE: 'NO'
  TRAIN_TEMPERATURE: 0.7
  TEST_TEMPERATURE: 0.0
  N_WORKERS: 1
  VERBOSITY: 'INFO'
  USE_LORA: "true"
  USE_SCRATCH_CHECKPOINTS: "false"   # LoRA adapters are tiny; GPFS home quota is not a concern
  # LoRA optimizer state is only ~10s of MB — enabling matches production config.yaml and
  # config_smoke8b.yaml. Rotation keeps only latest + best, so disk cost stays bounded.
  SAVE_OPTIMIZER: "true"

python_args:
  agentflow.port: 9999
  ray_init.num_cpus: 16
  algorithm.adv_estimator: 'grpo'
  data.train_files: '${BASE_DATA_DIR}/train/combined_train.parquet'
  data.val_files:
    - '${BASE_DATA_DIR}/val/val_combined.parquet'
  data.train_batch_size: 4
  data.train_max_samples: 8
  data.dataloader_num_workers: 0
  data.max_prompt_length: 4096
  data.max_response_length: 2048
  data.truncation: 'truncate'
  actor_rollout_ref.rollout.n: 2
  actor_rollout_ref.actor.ppo_mini_batch_size: 4
  actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu: 1
  actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu: 1
  actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu: 1
  actor_rollout_ref.rollout.multi_turn.format: 'hermes'
  actor_rollout_ref.model.path: '${BASE_MODEL}'
  actor_rollout_ref.model.enable_gradient_checkpointing: true
  actor_rollout_ref.model.use_remove_padding: true
  actor_rollout_ref.actor.optim.lr: 1.0e-6
  actor_rollout_ref.actor.use_kl_loss: true
  actor_rollout_ref.actor.kl_loss_coef: 0.01
  actor_rollout_ref.actor.clip_ratio_low: 0.2
  actor_rollout_ref.actor.clip_ratio_high: 0.3
  # N_GPUS=1 → base model is NOT sharded across GPUs (full 8 GB on-GPU during training).
  # LoRA: optimizer state is only ~10s of MB, so optimizer_offload is conservative but harmless.
  # param_offload=True: during rollout, vLLM takes 56.4 GB (util=0.6 set by launch_verl.py for
  # LoRA) and the 8 GB FSDP actor shard would sit alongside it → 64.4 GB. With H100 94 GB
  # that fits (29.6 GB headroom), but offloading actor params to CPU during rollout leaves an
  # extra cushion and avoids any memory-fragmentation risk before compute_log_prob.
  # (config.yaml uses param_offload=false because N_GPUS=4 shards the actor to ~2 GB/GPU.)
  actor_rollout_ref.actor.fsdp_config.param_offload: true
  actor_rollout_ref.actor.fsdp_config.optimizer_offload: true
  actor_rollout_ref.ref.fsdp_config.param_offload: true
  actor_rollout_ref.rollout.name: 'vllm'
  # gpu_memory_utilization=0.45 is the base value; launch_verl.py overrides it to 0.6 for LoRA
  # → 56.4 GB vLLM budget (8 GB Qwen3-4B model + 48.4 GB KV) on H100 94 GB.
  # free_cache_engine=True (required for LoRA): destroys the vLLM KV-cache engine after each
  # rollout so (a) LoRA adapter weights are cleanly swapped and (b) the FSDP actor gets a
  # defragmented memory state before compute_log_prob. Without this, async rollout leaves
  # fragmented CUDA memory that causes an "illegal memory access" at the next GPU copy.
  actor_rollout_ref.rollout.free_cache_engine: true
  actor_rollout_ref.rollout.gpu_memory_utilization: 0.45
  actor_rollout_ref.rollout.max_model_len: 6144
  # max_num_batched_tokens must be >= max_model_len so a single full-length sequence can be processed.
  actor_rollout_ref.rollout.max_num_batched_tokens: 6144
  actor_rollout_ref.rollout.tensor_model_parallel_size: '${ROLLOUT_TP_SIZE}'
  trainer.n_gpus_per_node: '${N_GPUS}'
  trainer.logger: ['console', 'wandb']
  trainer.project_name: '${PROJECT_NAME}'
  trainer.experiment_name: '${EXPERIMENT_NAME}'
  # Step-based val + save: smoke has 8/4 = 2 steps → freq=1 exercises the step-mode code path
  # on every step (+ val_before_train at step 0). _rotate_checkpoints keeps latest + best.
  trainer.save_freq: 1
  trainer.test_freq: 1
  trainer.save_every_epoch: false
  trainer.val_every_epoch: false
  trainer.total_epochs: 1
  trainer.val_before_train: true
  trainer.critic_warmup: 0
  algorithm.use_kl_in_reward: false

lora:                     # applied only when USE_LORA=true
  rank: 64
  alpha: 64               # alpha=rank → scaling factor 1.0 (neutral LoRA initialisation)
  target_modules: "all-linear"
  # resume_adapter_path:  # Optional: path to a saved lora_adapter/ directory to resume from.
  #   Leave unset (or null) for fresh training from the base model.
  # merge: false           # Set true only when using the SGLang rollout backend; vLLM uses false (default).
