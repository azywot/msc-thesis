# GAIA-text — Qwen3-32B, no tools, orchestrator thinking

name: "TEXT_baseline_gaia_qwen32B_no_tools_orchestrator"
description: "[Baseline; NO image_inspector, NO mindmap; text-only, sampled] GAIA-text all_validation_text with Qwen3-32B, no tools, orchestrator thinking"

slurm:
  partition: "gpu_h100"
  num_gpus: 2
  ntasks: 1
  cpus_per_task: 8
  time: "24:00:00"
  conda_env: "agent_engine"

models:
  orchestrator:
    name: "Qwen3-32B"
    family: "qwen3"
    path_or_id: "Qwen/Qwen3-32B"
    role: "orchestrator"
    tensor_parallel_size: 2  # 64 heads; TP must divide 64.
    sampling_by_thinking:
      thinking:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
      non_thinking:
        temperature: 0.7
        top_p: 0.8
        top_k: 20

tools:
  enabled_tools: []
  direct_tool_call: true

dataset:
  name: "gaia"
  split: "all_validation_text"
  data_dir: "./data"
  subset_num: -1

seed: 0
thinking_mode: "ORCHESTRATOR_ONLY"
baseline: true
output_dir: "./experiments/results/TEXT_baseline/gaia/qwen32B_no_tools_orchestrator"
use_wandb: true
wandb_project: "benchmarks_text"

cache_dir: "./cache"
