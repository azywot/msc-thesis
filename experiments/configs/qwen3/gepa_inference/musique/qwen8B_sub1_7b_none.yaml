# MuSiQue — GEPA-optimised prompts, Qwen3-8B orchestrator + Qwen3-1.7B subagents, no thinking

name: "GEPA_eval_musique_qwen8B_sub1_7b_none"
description: "[GEPA inference] MuSiQue validation_subset_200 with Qwen3-8B orchestrator (no thinking) + Qwen3-1.7B subagents (no thinking). Uses GEPA-optimised system_prompt and planning_suffix."

slurm:
  partition: "gpu_h100"
  num_gpus: 2
  ntasks: 1
  cpus_per_task: 8
  time: "24:00:00"
  conda_env: "agent_engine"

models:
  orchestrator:
    name: "Qwen3-8B"
    family: "qwen3"
    path_or_id: "Qwen/Qwen3-8B"
    role: "orchestrator"
  web_search:
    name: "Qwen3-1.7B"
    family: "qwen3"
    path_or_id: "Qwen/Qwen3-1.7B"
    role: "web_search"
  code_generator:
    name: "Qwen3-1.7B"
    family: "qwen3"
    path_or_id: "Qwen/Qwen3-1.7B"
    role: "code_generator"

tools:
  enabled_tools:
    - web_search
    - code_generator
  direct_tool_call: false

dataset:
  name: "musique"
  split: "validation_subset_200"
  data_dir: "./data"
  subset_num: -1

gepa_prompt_path: "experiments/results/gepa/gaia/2026-05-26-21-06-40_23128167/best_candidate.json"

seed: 0
thinking_mode: "NO"
output_dir: "./experiments/results/gepa_inference/musique/qwen8B_sub1_7b_none"
use_wandb: true
wandb_project: "benchmarks"

cache_dir: "./cache"
