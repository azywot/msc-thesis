# GAIA — SFT-adapted Qwen3-8B orchestrator + Qwen3-1.7B subagents, thinking disabled
# Update lora_adapter_path once training is complete (replace <run-tag> printed by 008_train_sft_folded.job).

name: "SFT_eval_gaia_qwen8B_sub1_7b_none"
description: "[SFT inference] GAIA all_validation with SFT-adapted Qwen3-8B orchestrator (thinking disabled) + Qwen3-1.7B subagents (no thinking)."

slurm:
  partition: "gpu_h100"
  num_gpus: 2
  ntasks: 1
  cpus_per_task: 8
  time: "24:00:00"
  conda_env: "agent_engine"

models:
  orchestrator:
    name: "Qwen3-8B-SFT"
    family: "qwen3"
    path_or_id: "Qwen/Qwen3-8B"
    role: "orchestrator"
    lora_adapter_path: "/gpfs/home3/xchen1/azywot/msc-thesis/data/adapters/qwen3-8b-sft-folded-v1/<run-tag>/best_adapter"
  web_search:
    name: "Qwen3-1.7B"
    family: "qwen3"
    path_or_id: "Qwen/Qwen3-1.7B"
    role: "web_search"
  code_generator:
    name: "Qwen3-1.7B"
    family: "qwen3"
    path_or_id: "Qwen/Qwen3-1.7B"
    role: "code_generator"
  text_inspector:
    name: "Qwen3-1.7B"
    family: "qwen3"
    path_or_id: "Qwen/Qwen3-1.7B"
    role: "text_inspector"

tools:
  enabled_tools:
    - web_search
    - code_generator
    - text_inspector
  direct_tool_call: false

dataset:
  name: "gaia"
  split: "all_validation"
  data_dir: "./data"
  subset_num: -1

seed: 0
thinking_mode: "NO"
output_dir: "./experiments/results/sft_inference/gaia/qwen8B_sub1_7b_none"
use_wandb: true
wandb_project: "benchmarks"

cache_dir: "./cache"
