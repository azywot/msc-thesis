# MuSiQue — arm I adapted Qwen3-8B orchestrator + Qwen3-8B subagents, thinking disabled
# Update lora_adapter_path once training is complete (replace <run-tag> printed by 007_train_sft_folded.job).

name: "RSI_ArmI_eval_musique_qwen8B_sub8B_none"
description: "[RSI arm I inference] MuSiQue validation_subset_200 with arm I adapted Qwen3-8B orchestrator (thinking disabled) + Qwen3-8B subagents (no thinking)."

slurm:
  partition: "gpu_h100"
  num_gpus: 2
  ntasks: 1
  cpus_per_task: 8
  time: "24:00:00"
  conda_env: "agent_engine"

models:
  orchestrator:
    name: "Qwen3-8B-ArmI"
    family: "qwen3"
    path_or_id: "Qwen/Qwen3-8B"
    role: "orchestrator"
    lora_adapter_path: "/gpfs/home3/xchen1/azywot/msc-thesis/data/adapters/qwen3-8b-rsi-arm-i/<run-tag>/best_adapter"
  web_search:
    name: "Qwen3-8B"
    family: "qwen3"
    path_or_id: "Qwen/Qwen3-8B"
    role: "web_search"
  code_generator:
    name: "Qwen3-8B"
    family: "qwen3"
    path_or_id: "Qwen/Qwen3-8B"
    role: "code_generator"

tools:
  enabled_tools:
    - web_search
    - code_generator
  direct_tool_call: false

dataset:
  name: "musique"
  split: "validation_subset_200"
  data_dir: "./data"
  subset_num: -1

seed: 0
thinking_mode: "NO"
output_dir: "./experiments/results/rsi_inference/arm_i/musique/qwen8B_sub8B_none"
use_wandb: true
wandb_project: "benchmarks"

cache_dir: "./cache"
